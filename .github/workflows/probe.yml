# Throwaway. Answers one question that no machine we own can answer: on real
# Windows, does a bind to a specific address fail when a wildcard on the same
# port is already bound by the same process with SO_EXCLUSIVEADDRUSE?
#
# The answer decides whether the wildcard carve-out in InitHTTPServer is
# load-bearing or dead code. Delete this branch once it has reported.
name: winsock probe
on:
  push:
    branches: ['winsock-probe']
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: SO_EXCLUSIVEADDRUSE, wildcard against specific
        shell: python
        run: |
          import socket, sys

          PORT = 34567
          WSAEADDRINUSE = 10048

          def sock():
              # what BindAndStartListening does on Windows, in order
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_EXCLUSIVEADDRUSE, 1)
              return s

          def case(first, second):
              a = sock()
              a.bind((first, PORT))
              a.listen(1)
              b = sock()
              try:
                  b.bind((second, PORT))
                  out = "SECOND BIND SUCCEEDED"
              except OSError as e:
                  out = "SECOND BIND FAILED  winerror=%s  errno=%s  %s" % (
                      getattr(e, "winerror", None), e.errno, e.strerror)
                  if getattr(e, "winerror", None) == WSAEADDRINUSE:
                      out += "   <- this is WSAEADDRINUSE"
              finally:
                  b.close()
                  a.close()
              return out

          print("windows:", sys.getwindowsversion())
          print()
          print("control, same address twice   :", case("127.0.0.1", "127.0.0.1"))
          print("wildcard then specific        :", case("0.0.0.0", "127.0.0.1"))
          print("specific then wildcard        :", case("127.0.0.1", "0.0.0.0"))
