# Throwaway, fourth pass. The first three built the rule the fix rests on, that
# WSAEACCES from bind means an exclusive wildcard covers the address. Twelve
# cases produced it and every one of them was that. This pass spends the input
# that would refute it instead of confirming it again: binds that fail for
# other reasons, with nobody holding anything.
#
# The first case is not curiosity. The PR description promises that a -rpcbind
# naming an address the host does not have still starts. If that reports
# WSAEACCES on Windows, the change breaks the very case it promises to keep.
# Delete this branch once it has reported.
name: winsock probe
on:
  push:
    branches: ['winsock-probe']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: what else makes bind fail on ${{ matrix.os }}
        shell: python
        run: |
          import ctypes, socket, sys

          EXCL = socket.SO_EXCLUSIVEADDRUSE
          NAMES = {10013: "WSAEACCES", 10048: "WSAEADDRINUSE", 10049: "WSAEADDRNOTAVAIL",
                   10047: "WSAEAFNOSUPPORT", 10022: "WSAEINVAL"}

          def attempt(addr, port, fam="4"):
              f = socket.AF_INET6 if fam == "6" else socket.AF_INET
              s = socket.socket(f, socket.SOCK_STREAM)
              s.setsockopt(socket.SOL_SOCKET, EXCL, 1)
              try:
                  s.bind((addr, port))
                  s.listen(1)
                  return "PASSOU"
              except OSError as e:
                  w = getattr(e, "winerror", None)
                  tag = NAMES.get(w, "OUTRO")
                  flag = "   <<< seria lido como ocupado" if w in (10013, 10048) else ""
                  return "falhou %-6s %-18s%s" % (w, tag, flag)
              finally:
                  s.close()

          admin = False
          try:
              admin = bool(ctypes.windll.shell32.IsUserAnAdmin())
          except Exception:
              pass

          print("windows:", sys.getwindowsversion())
          print("processo elevado:", admin)
          print("")
          print("ninguem segura nada, o bind falha por outra razao:")
          print("  %-42s %s" % ("192.0.2.1 (a maquina nao tem)", attempt("192.0.2.1", 34567)))
          print("  %-42s %s" % ("255.255.255.255 (broadcast)", attempt("255.255.255.255", 34567)))
          print("  %-42s %s" % ("127.0.0.1 porta 80 (privilegiada)", attempt("127.0.0.1", 80)))
          print("  %-42s %s" % ("127.0.0.1 porta 443 (privilegiada)", attempt("127.0.0.1", 443)))
          print("  %-42s %s" % ("2001:db8::1 ipv6 que a maquina nao tem", attempt("2001:db8::1", 34567, "6")))
          print("  %-42s %s" % ("0.0.0.0 porta livre (controlo)", attempt("0.0.0.0", 34999)))
